<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Integration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="start-screen">
    <h1>Welcome to Integration Street!</h1>
    <h2>Discover how immigration brought color into American Lineage...</h2>
    <button id="start-btn"><img src="startbutton.png" alt="Start Game"></button>
</div>

<div id="game">
    <button id="back-btn">Back</button>
    <div id="world">
        <img id="background" src="background.png" alt="background">
        <img id="player" src="walk1.png" alt="player">
        <button class="enter-btn" id="enter-1">Click Me!</button>
        <button class="enter-btn" id="enter-2">Click Me!</button>
        <button class="enter-btn" id="enter-3">Click Me!</button>
    </div>
    <div id="location-text" style="display:none;"></div>
</div>

<script src="game.js"></script>

</body>
</html>
